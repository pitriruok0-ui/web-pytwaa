<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Saya</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            color: #00e676;
            margin-bottom: 10px;
        }
        p {
            color: #cccccc;
            font-size: 14px;
            line-height: 1.6;
        }
        .btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background-color: #00e676;
            color: #000000;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            transition: 0.3s;
        }
        .btn:hover {
            background-color: #00b359;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Selamat Datang!</h1>
        <p>Halo, ini adalah website pertama milikku yang dibuat dan di-hosting gratis lewat GitHub.</p>
        <p>Saya menyediakan berbagai layanan digital & kebutuhan akun terpercaya.</p>
        
        <!-- Ganti nomor WhatsApp di bawah ini dengan nomor kamu (format 628xxx) -->
        <a href="https://wa.me/6281234567890" class="btn" target="_blank">Hubungi Saya di WhatsApp</a>
    </div>

</body>
</html>
